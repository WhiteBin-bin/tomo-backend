name: "✨ 기능 개발"
description: "새로운 기능 개발 작업을 정의하고 추적합니다."
title: "[Feat] "
labels: ["✨ Feature"]
body:
  - type: textarea
    id: objective
    attributes:
      label: "💻 구현할 기능"
      description: "개발할 기능의 목표와 주요 내용을 명확하게 작성해주세요."
      placeholder: |
        - 예: 사용자가 프로필 정보를 수정할 수 있는 기능 구현
    validations:
      required: true

  - type: textarea
    id: tech-spec
    attributes:
      label: "🛠️ 기술 사항 (선택 사항)"
      description: "API, 데이터 구조, 외부 연동, 라이브러리 등 필요한 기술적 변경 사항을 작성해주세요."
      placeholder: |
        - API: 수정이 필요한 엔드포인트 또는 인터페이스
        - Data: 저장 구조 또는 스키마 변경 여부
        - Dependency: 추가 또는 변경이 필요한 외부 의존성
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 세부 작업 목록 (To-Do)"
      description: "기능을 완성하기 위한 작업을 체크리스트로 작성해주세요."
      placeholder: |
        - [ ] 요구사항 및 인터페이스 정의
        - [ ] 핵심 로직 구현
        - [ ] 예외 상황 처리
        - [ ] 테스트 작성 및 동작 확인
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "🏁 완료 조건 (Acceptance Criteria)"
      description: "어떤 조건이 충족되어야 작업이 완료된 것으로 판단할지 작성해주세요."
      placeholder: |
        - [ ] 정의한 정상 시나리오가 동작한다.
        - [ ] 주요 예외 상황이 올바르게 처리된다.
        - [ ] 관련 테스트가 통과한다.
    validations:
      required: false
