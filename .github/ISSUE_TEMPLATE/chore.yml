name: "⚙️ 설정 및 기타 작업"
description: "의존성, 개발 환경, 빌드 설정 등 기능 개발 외 작업을 정의합니다."
title: "[Chore] "
labels: ["⚙️ Chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: "📄 작업 요약"
      description: "수행하려는 설정, 의존성, 빌드 또는 개발 환경 관련 작업을 작성해주세요."
      placeholder: |
        - 예: 코드 포맷터 설정 추가
        - 예: 프로젝트 의존성 버전 업데이트
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: "🎯 작업 목적 / 필요성"
      description: "해당 작업이 필요한 이유와 기대 효과를 작성해주세요."
      placeholder: |
        - 현재 문제:
        - 작업 목적:
    validations:
      required: true

  - type: textarea
    id: tech-spec
    attributes:
      label: "🛠️ 변경 사항 (선택 사항)"
      description: "수정되거나 추가될 설정 파일, 패키지, 도구 등을 작성해주세요."
      placeholder: |
        - 설정 파일:
        - 추가 / 변경 의존성:
        - 개발 도구:
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 세부 작업 목록 (To-Do)"
      description: "작업을 수행하기 위한 세부 단계를 체크리스트로 작성해주세요."
      placeholder: |
        - [ ] 설정 또는 의존성 변경
        - [ ] 적용 여부 확인
        - [ ] 기존 개발 환경 영향 확인
        - [ ] 관련 문서 업데이트
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "🏁 완료 조건"
      description: "작업이 완료되었다고 판단할 기준을 작성해주세요."
      placeholder: |
        - [ ] 변경한 설정이 정상적으로 적용된다.
        - [ ] 기존 실행 및 빌드 과정에 문제가 없다.
    validations:
      required: false
