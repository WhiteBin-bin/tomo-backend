name: "🔒 보안 작업"
description: "인증, 인가, 보안 설정 및 보안 강화 작업을 정의합니다."
title: "[Security] "
labels: ["🔒 Security"]
body:
  - type: markdown
    attributes:
      value: |
        > 공개 저장소에서는 실제 비밀키, 토큰, 개인정보 또는 악용 가능한 취약점 상세 내용을 작성하지 마세요.

  - type: textarea
    id: summary
    attributes:
      label: "🔒 작업 요약"
      description: "진행하려는 보안 관련 작업을 간결하게 작성해주세요."
      placeholder: |
        - 예: 특정 API의 접근 권한 검증 강화
        - 예: 보안 헤더 및 인증 정책 정비
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "🎯 배경 및 영향 범위"
      description: "작업이 필요한 이유와 영향을 받는 기능 또는 범위를 작성해주세요."
      placeholder: |
        - 현재 상황:
        - 영향 범위:
        - 고려해야 할 보안 정책:
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "🛡️ 대응 / 개선 방안"
      description: "적용할 보안 조치 또는 개선 방향을 작성해주세요."
      placeholder: |
        - 접근 제어 강화
        - 입력값 검증 추가
        - Secret / 권한 정책 변경
        - 보안 설정 점검
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 세부 작업 목록 (To-Do)"
      description: "보안 작업을 완료하기 위한 단계를 체크리스트로 작성해주세요."
      placeholder: |
        - [ ] 영향 범위 확인
        - [ ] 보안 정책 또는 코드 수정
        - [ ] 정상 / 비정상 접근 시나리오 검증
        - [ ] 관련 테스트 및 설정 확인
    validations:
      required: true
