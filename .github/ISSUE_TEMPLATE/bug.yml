name: "🐛 버그 수정"
description: "발생한 버그를 재현하고 원인을 분석하여 수정 작업을 추적합니다."
title: "[Bug] "
labels: ["🐛 Bug"]
body:
  - type: textarea
    id: bug-summary
    attributes:
      label: "📄 버그 요약"
      description: "현재 발생하는 문제를 간결하게 설명해주세요."
      placeholder: "예: 특정 조건에서 요청 처리 중 예외가 발생함"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "🔁 재현 방법"
      description: "버그를 확인할 수 있는 조건과 재현 절차를 작성해주세요."
      placeholder: |
        1. 특정 조건의 데이터를 준비한다.
        2. 해당 기능을 실행한다.
        3. 예상과 다른 결과 또는 오류를 확인한다.
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: "🎯 원인 분석 (선택 사항)"
      description: "로그나 코드 분석을 통해 확인한 원인이 있다면 작성해주세요."
      placeholder: |
        - 확인한 원인:
        - 관련 로그 / 코드:
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: "💡 해결 방안 (선택 사항)"
      description: "예상하는 수정 방향이나 고려해야 할 사항이 있다면 작성해주세요."
      placeholder: |
        - 수정 방향:
        - 영향 범위:
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 세부 작업 목록 (To-Do)"
      description: "버그를 해결하기 위한 작업을 체크리스트로 작성해주세요."
      placeholder: |
        - [ ] 문제 재현 및 원인 확인
        - [ ] 수정 코드 작성
        - [ ] 회귀 테스트 작성 또는 수행
        - [ ] 수정 결과 확인
    validations:
      required: true
